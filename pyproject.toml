[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "token-speed"
version = "0.1.0"
readme = "README.md"
description = "Measure standardized Codex prefill and decode through the local app-server"
requires-python = ">=3.11"
dependencies = ["tiktoken>=0.12,<1"]

[project.scripts]
token-speed = "token_speed.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["token_speed*"]
